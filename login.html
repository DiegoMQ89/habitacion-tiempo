<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - La Habitación del Tiempo</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="fade-in login">

  <header>
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="La Habitación del Tiempo" />
      </a>
      <nav>
        <div id="hamburger"><i class="fas fa-bars"></i></div>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="sedes.html">Sedes</a></li>
          <li><a href="services.html">Servicios</a></li>
          <li><a href="contact.html">Contacto</a></li>
          <li><a href="register.html">Registrarse</a></li>
          <li><a href="login.html" class="btn-nav">Ingresar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero de Login -->
  <section class="login-hero">
    <div class="container">
      <h2>Bienvenido de nuevo</h2>
      <p>Accede a tu cuenta y continúa tu transformación.</p>
    </div>
  </section>

  <!-- Sección de Login -->
  <section class="login-section">
    <div class="container login-container">

      <!-- Card de Login -->
      <div class="login-card">
        <h3>Iniciar Sesión</h3>
        <form>
          <input type="email" placeholder="Correo electrónico" required />
          <input type="password" placeholder="Contraseña" required />
          <button type="submit" class="btn">Ingresar</button>
        </form>
        <div class="login-links">
          <a href="#">¿Olvidaste tu contraseña?</a>
          <span>|</span>
          <a href="register.html">Crear cuenta</a>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>&copy; 2025 La Habitación del Tiempo</p>
    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-whatsapp"></i></a>
      <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>

</html>
